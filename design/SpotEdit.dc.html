    a:hover{color:#7fe6b6}
  </style>
</helmet>
<div style="width:390px;height:844px;background:#15171b;color:#f2f4f7;display:flex;flex-direction:column">
  <div style="height:264px;position:relative;flex-shrink:0;background:#1a1d22;overflow:hidden">
    <svg width="390" height="264" viewBox="0 0 390 264" fill="none" style="display:block">
      <rect width="390" height="264" fill="#1a1d22"/>
      <g stroke="#23272d" stroke-width="14" stroke-linecap="square">
        <path d="M-10 74h410"/><path d="M-10 196h410"/><path d="M92 -10v284"/><path d="M282 -10v284"/>
      </g>
      <g stroke="#20242a" stroke-width="6">
        <path d="M-10 132h410"/><path d="M186 -10v284"/><path d="M340 -10v284"/>
      </g>
      <g fill="#1e2228">
        <rect x="106" y="88" width="64" height="30" rx="3"/><rect x="200" y="88" width="66" height="30" rx="3"/>
        <rect x="106" y="146" width="64" height="36" rx="3"/><rect x="200" y="146" width="66" height="36" rx="3"/>
        <rect x="296" y="88" width="36" height="30" rx="3"/><rect x="296" y="146" width="36" height="36" rx="3"/>
      </g>
      <circle cx="195" cy="132" r="76" fill="#3ad693" fill-opacity="0.07" stroke="#3ad693" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="5 5"/>
      <circle cx="195" cy="132" r="7" fill="#3ad693"/>
      <path d="M195 96c-11 0-20 9-20 20 0 14 20 32 20 32s20-18 20-32c0-11-9-20-20-20z" fill="#3ad693"/>
      <circle cx="195" cy="116" r="7" fill="#15171b"/>
    </svg>
    <div style="position:absolute;left:22px;top:70px;width:44px;height:44px;border-radius:14px;background:rgba(21,23,27,0.82);border:1px solid #31363d;display:flex;align-items:center;justify-content:center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f2f4f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(to bottom, rgba(21,23,27,0), #15171b)"></div>
  </div>

  <div style="padding:4px 26px 0;display:flex;flex-direction:column;gap:22px;flex-grow:1">
    <div style="display:flex;flex-direction:column;gap:9px">
      <div style="font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#6d7681;font-weight:600">Spot name</div>
      <div style="height:56px;border-radius:14px;background:#1e2126;border:1px solid #31363d;display:flex;align-items:center;padding:0 18px;font-size:18px;font-weight:500">Office</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:#6d7681;font-weight:600">Your headstart</div>
      <div style="font-size:16px;line-height:1.5;color:#a8b0ba">How long from your desk to the curb? Only you can change this &#8212; Mostafi can&#8217;t set it for you.</div>
      <div style="border-radius:16px;background:#1e2126;border:1px solid #31363d;padding:22px 20px;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;color:#f0a13c;font-variant-numeric:tabular-nums">3</div>
          <div style="font-size:20px;font-weight:500;color:#a8b0ba">minutes</div>
        </div>
        <div style="position:relative;height:24px;display:flex;align-items:center">
          <div style="height:6px;border-radius:3px;background:#31363d;width:100%"></div>
          <div style="position:absolute;left:0;height:6px;border-radius:3px;background:#f0a13c;width:24%"></div>
          <div style="position:absolute;left:24%;width:32px;height:32px;border-radius:16px;background:#f0a13c;margin-left:-16px;border:3px solid #1e2126"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#6d7681;font-variant-numeric:tabular-nums">
          <div>1 min</div><div>15 min</div>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0">
      <div style="display:flex;flex-direction:column;gap:3px">
        <div style="font-size:16px;font-weight:600">Arrival radius</div>
        <div style="font-size:14px;color:#6d7681">counts as arrived within</div>
      </div>
      <div style="height:44px;padding:0 16px;border-radius:12px;background:#1e2126;border:1px solid #31363d;display:flex;align-items:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums">100 m</div>
    </div>

    <div style="flex-grow:1"></div>
    <div style="padding-bottom:38px">
      <div style="height:56px;border-radius:14px;background:#3ad693;color:#0c1c14;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center">Save spot</div>
    </div>
  </div>
</div>
</x-dc>
